name: Build Android APK (ScadenzApp)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ScadenzApp.apk'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed APK
        working-directory: ./android-app
        run: gradle assembleRelease --no-daemon

      - name: Copy APK to root as ScadenzApp.apk
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk ./ScadenzApp.apk
          ls -lh ./ScadenzApp.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScadenzApp-apk
          path: ./ScadenzApp.apk

      - name: Commit ScadenzApp.apk to repository
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ScadenzApp.apk
          git diff --staged --quiet || (git commit -m "chore: update compiled ScadenzApp.apk [skip ci]" && git push origin HEAD:main)

      - name: Publish / Update Latest GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ScadenzApp Android (.APK)"
          files: ./ScadenzApp.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
