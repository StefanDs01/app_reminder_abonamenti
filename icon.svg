<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spendioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE45E" />
      <stop offset="55%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <radialGradient id="coinFace" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FFF078" />
      <stop offset="65%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </radialGradient>
    <filter id="coinShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#92400E" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="118" fill="url(#spendioBg)" />

  <!-- Outer Coin Circle -->
  <g filter="url(#coinShadow)">
    <circle cx="256" cy="258" r="156" fill="url(#coinFace)" stroke="#1E1B18" stroke-width="8" />
    <circle cx="256" cy="258" r="134" fill="none" stroke="#1E1B18" stroke-width="5" stroke-opacity="0.75" />
  </g>

  <!-- 4-Point Sparkle on Top Left of Coin -->
  <path d="M138 128 C142 152 148 158 172 162 C148 166 142 172 138 196 C134 172 128 166 104 162 C128 158 134 152 138 128 Z"
        fill="#FFFBEB" stroke="#1E1B18" stroke-width="5" stroke-linejoin="round" />

  <!-- Cute Eyes -->
  <g>
    <ellipse cx="212" cy="246" rx="19" ry="21" fill="#1E1B18" />
    <circle cx="206" cy="239" r="6.5" fill="#FFFFFF" />
    <circle cx="218" cy="252" r="3" fill="#FFFFFF" />

    <ellipse cx="300" cy="246" rx="19" ry="21" fill="#1E1B18" />
    <circle cx="294" cy="239" r="6.5" fill="#FFFFFF" />
    <circle cx="306" cy="252" r="3" fill="#FFFFFF" />
  </g>

  <!-- Soft Warm Cheeks -->
  <ellipse cx="182" cy="272" rx="14" ry="8" fill="#F59E0B" opacity="0.65" />
  <ellipse cx="330" cy="272" rx="14" ry="8" fill="#F59E0B" opacity="0.65" />

  <!-- Cute Happy Mouth -->
  <path d="M236 276 Q256 298 276 276" fill="none" stroke="#1E1B18" stroke-width="9" stroke-linecap="round" />
</svg>
