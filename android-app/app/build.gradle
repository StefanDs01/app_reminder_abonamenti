plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inimaaiassist.scadenzapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.inimaaiassist.scadenzapp"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
